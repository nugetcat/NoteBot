[package]
name = "notebot"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A lightweight, open-source desktop sticky notes app, ported from the original NoteBot."
build = "build.rs"

[dependencies]
slint = "1.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
java-serialization = "0.1.0"

[build-dependencies]
slint-build = "1.18.1"
